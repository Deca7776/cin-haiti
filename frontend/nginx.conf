server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html référence les fichiers hashés (index-XXXXXXXX.js/css) : s'il reste en cache
    # navigateur, une nouvelle image déployée continue de servir l'ancien bundle silencieusement
    # (observé le 21/08/2026 après une mise à jour de l'UI, non visible sans vidage de cache).
    # Jamais de cache sur l'index, cache long sur les assets hashés puisque leur nom change à
    # chaque build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://cin-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # L'OCR fait plusieurs appels sequentiels a un service PaddleOCR mono-worker (10 zones
        # ROI + jusqu'a 2 passes plein texte) ; sur une vraie photo cela peut prendre plus que
        # les 60s par defaut, ce qui provoquait un 504 cote nginx avant meme que cin-api ait fini.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
