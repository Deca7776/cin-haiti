services:
  postgres:
    image: postgres:16-alpine
    container_name: cin-postgres
    environment:
      POSTGRES_DB: cin_db
      POSTGRES_USER: cin_user
      POSTGRES_PASSWORD: cin_secret
    ports:
      - "5432:5432"
    volumes:
      - cin_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cin_user -d cin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cin-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cin-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cin_minio_data:/data

  cin-api:
    build: .
    container_name: cin-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cin_db
      DB_USER: cin_user
      DB_PASSWORD: cin_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      AES_ENCRYPTION_KEY: "0123456789ABCDEF0123456789ABCDEF"
      INSTANCE_REGISTRATION_TOKEN: "demo-registration-token"
      MAX_INSTANCES: "5"
    ports:
      - "8080:8080"

volumes:
  cin_pg_data:
  cin_minio_data:
