services:
  postgres:
    image: postgres:16-alpine
    container_name: cin-postgres
    environment:
      POSTGRES_DB: cin_db
      POSTGRES_USER: cin_user
      POSTGRES_PASSWORD: cin_secret
    ports:
      - "5432:5432"
    volumes:
      - cin_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cin_user -d cin_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cin-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cin-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cin_minio_data:/data

  ocr-service:
    build: ./ocr-service
    container_name: cin-ocr-service
    # PaddleOCR bloque le seul worker uvicorn le temps d'une inference CPU longue ; sans init
    # process, un processus fige ne peut plus etre correctement signale/tue par Docker
    # ("container is zombie and can not be killed" observe le 17/08/2026).
    init: true
    # Le moteur oneDNN de PaddleOCR peut segfaulter (SIGSEGV) sur certaines images plutot que de
    # lever une exception Python rattrapable -- observe le 19/08/2026 sur un recadrage degenere,
    # apres deux occurrences absorbees sans probleme par le try/except de /recognize. Un segfault
    # tue tout le process worker d'un coup ; sans politique de redemarrage, cin-api perdait alors
    # son moteur OCR primaire pour le reste de la session (repli Tesseract local permanent jusqu'a
    # intervention manuelle). "unless-stopped" fait remonter le service tout seul.
    restart: unless-stopped
    ports:
      - "9002:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cin-api:
    build: .
    container_name: cin-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      ocr-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cin_db
      DB_USER: cin_user
      DB_PASSWORD: cin_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      AES_ENCRYPTION_KEY: "0123456789ABCDEF0123456789ABCDEF"
      INSTANCE_REGISTRATION_TOKEN: "demo-registration-token"
      MAX_INSTANCES: "5"
      OCR_SERVICE_URL: http://ocr-service:9000
      OCR_LOCAL_FALLBACK: "true"
      # /prepare et /layout font tourner PaddleOCR sur la carte entiere (pas juste un petit
      # recadrage) : sous charge CPU, ca peut depasser 30s (SocketTimeoutException observe le
      # 19/08/2026 alors que le service traitait la requete avec succes, juste trop lentement).
      OCR_SERVICE_TIMEOUT_MS: "60000"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: cin-frontend
    depends_on:
      cin-api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  cin_pg_data:
  cin_minio_data:
